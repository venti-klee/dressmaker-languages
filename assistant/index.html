<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#342c28;background:#f5f1e9}*{box-sizing:border-box}body{max-width:1180px;margin:0 auto;padding:38px 24px}h1{font-size:30px;margin:8px 0 12px}h2{font-size:18px;margin:0 0 20px}.eyebrow{color:#807062;letter-spacing:2px;font-size:12px}p{line-height:1.7;color:#74665c}.grid{display:grid;grid-template-columns:330px 1fr;gap:20px;margin-top:30px}.card{padding:24px;border:1px solid #ded6c8;border-radius:18px;background:#fffdf8}label{display:block;font-size:13px;font-weight:600;margin:18px 0 8px}select,input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid #d7ccbc;background:#fff;border-radius:8px;color:#342c28;font-size:14px}button{padding:10px 15px;border:1px solid #c7b8a2;background:#fcf9f2;color:#44392d;border-radius:9px;cursor:pointer;font-size:13px}.primary{background:#476952;color:white;border-color:#476952}.danger{color:#944633}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.switch{display:flex;align-items:center;gap:8px;line-height:1.5;font-weight:400}.hint{font-size:12px;margin:7px 0}.status{padding:15px 20px;background:#e5ece2;border-radius:12px;font-size:13px;line-height:1.7}.error{color:#934c2f;white-space:pre-wrap}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.toolbar input{flex:1}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#857467;padding:10px 6px;font-weight:500;border-bottom:1px solid #d7ccbc}td{border-bottom:1px solid #eee8de;padding:14px 6px;vertical-align:top;word-break:break-word}td:first-child{width:42%}textarea{width:100%;min-height:58px;padding:8px;border:1px solid #e3dace;border-radius:7px;resize:vertical;font:inherit;background:#fff}.badge{font-size:10px;color:#887868;margin-top:6px}.scroll{max-height:610px;overflow:auto}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 22px;background:#342c28;color:white;border-radius:10px;display:none;max-width:90 </div>

<nav class="pagination" data-i18n-aria="pagination_label"><div class="page-controls"><button id="page-prev" data-i18n="page_prev"></button><input id="list-page" type="number" min="1" value="1" data-i18n-aria="page_jump"><span id="page-total"></span><button id="page-next" data-i18n="page_next"></button></div><select id="page-size" style="width:auto" data-i18n-aria="page_size"><option value="25" data-i18n="page_size_25"></option><option value="50" selected data-i18n="page_size_50"></option><option value="100" data-i18n="page_size_100"></option></select></nav>

</div></div><div class="note"><span data-i18n="credits"></span><div class="buttons"><button id="shutdown" data-i18n="shutdown"></button></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const catalogs=__I18N__,session='__SESSION__',$=id=>document.getElementById(id);
const nativeNames={'zh-CN':'简体中文',en:'English',ja:'日本語',ko:'한국어',fr:'Français',de:'Deutsch',es:'Español'};
function normalizeLocale(value){if(!value)return 'en';value=value.toLowerCase();if(value.startsWith('zh'))return 'zh-CN';const base=value.split('-')[0];return catalogs[base]?base:'en';}
let storedLocale=null;try{storedLocale=localStorage.getItem('dressmaker-ui-language');}catch(e){}
let uiLocale=normalizeLocale(storedLocale||navigator.language),ready=false,lastStatus=null,lastEntries=[],lastEntriesLanguage=null,stopped=false,pollTimer=null;
let entriesRequest=0,polling=false,entriesSignature='',recentSignature='';
let listPage=1,lastPage=null,searchTimer=null;
const drafts=new Map();let currentToast=null,toastTimer=null;
function t(key,params={}){const text=catalogs[uiLocale]?.[key]??catalogs.en[key]??key;return text.replace(/\{(\w+)\}/g,(match,name)=>String(params[name]??match));}
function errorText(info,raw=''){return info?t(info.key,info.params||{}):raw?t('error_generic',{detail:raw}):'';}
function gameLabel(language){return language==='en'?t('english_original'):(nativeNames[language]||language);}
function renderStatus(){if(stopped){$('status').textContent=t('stopped');return;}if(!lastStatus){$('status').textContent=t('connecting');return;}const j=lastStatus,number=new Intl.NumberFormat(uiLocale);$('status').textContent=t(j.installed?'installed':'not_installed')+' · '+gameLabel(j.config.language)+' · '+t('status_counts',{dictionary:number.format(j.dictionary),cached:number.format(j.cached),pending:number.format(j.pending)});$('error').textContent=errorText(j.error_info,j.error);$('model-status').textContent=t('model_'+(j.model?.state||'idle'),{detail:j.model?.detail||''});$('model').disabled=!!j.model?.running;const b=j.budget;$('budget-status').textContent=b?t('budget_status',{used:number.format(b.used),limit:number.format(b.limit),remaining:number.format(b.remaining)}):'';renderProgress();}
function providerLabel(provider){return {'google':t('badge_google'),'bing':t('badge_bing'),'mymemory':'MyMemory','libre':'LibreTranslate','argos-offline':t('badge_offline'),'dictionary':t('badge_dictionary'),'dictionary-composed':t('badge_composed'),'manual':t('badge_manual'),'original':t('filter_original'),'lookup':t('progress_lookup'),'untranslated':t('progress_untranslated'),'':t('badge_pending')}[provider]||provider;}
function renderProgress(){const p=lastStatus?.progress||{state:'idle',active:false,total:0,processed:0,translated:0,untranslated:0,failed:0,recent:[]},n=new Intl.NumberFormat(uiLocale),state=stopped?'interrupted':p.state;$('progress-state').textContent=t('progress_'+state);$('translate').disabled=!!p.active&&!stopped;$('switch-provider').disabled=stopped;const bar=$('translation-progress');bar.max=Math.max(1,p.total);if(p.active&&!p.total)bar.removeAttribute('value');else bar.value=p.processed;$('progress-counts').textContent=t('progress_counts',{processed:n.format(p.processed),total:n.format(p.total),translated:n.format(p.translated),untranslated:n.format(p.untranslated),failed:n.format(p.failed),remaining:n.format(p.remaining??Math.max(0,p.total-p.processed))});const seconds=Math.max(0,Math.ceil((p.wait_until||0)-Date.now()/1000));$('progress-timing').textContent=state==='waiting'?t('progress_wait',{seconds:n.format(seconds)}):state==='cooldown'?t('progress_cooldown_wait',{seconds:n.format(seconds)}):p.started_at?t('progress_elapsed',{seconds:n.format(Math.floor(p.elapsed||0)),language:gameLabel(p.language)}):t('progress_idle_hint');$('progress-current').textContent=p.current||(p.active?t('progress_next'):t('progress_no_current'));$('progress-provider').textContent=p.current?t('progress_provider',{provider:providerLabel(p.provider)}):'';$('progress-error').textContent=errorText(p.error_info);const signature=uiLocale+JSON.stringify(p.recent);if(signature!==recentSignature){recentSignature=signature;$('progress-recent').replaceChildren();for(const item of p.recent){const li=document.createElement('li'),label=document.createElement('div'),result=document.createElement('div');label.textContent=t('progress_result_'+item.outcome)+' · '+gameLabel(item.language)+' · '+providerLabel(item.provider)+'\n'+item.source;li.append(label);if(item.outcome==='success'){result.textContent=item.value;result.className='result';li.append(result);}else if(item.error_info){result.textContent=errorText(item.error_info);result.className='failed';li.append(result);}$('progress-recent').append(li);}}$('progress-empty').hidden=!!p.recent.length;}
function renderListMeta(){const n=new Intl.NumberFormat(uiLocale);if(lastPage){$('list-summary').textContent=t('list_summary',{total:n.format(lastPage.total),missing:n.format(lastPage.counts.missing||0),matching:n.format(lastPage.matching),start:n.format(lastPage.start),end:n.format(lastPage.end),language:gameLabel(lastEntriesLanguage)});const missing=lastPage.missing_by_kind||{};$('candidate-hint').textContent=t('missing_breakdown',{display:n.format(missing.display||0),content:n.format(missing.content||0),loader:n.format(missing.loader||0),stored:n.format(missing.stored||0)})+(missing.loader?' '+t('candidate_hint'):'');$('list-page').value=listPage;$('list-page').max=lastPage.pages;$('page-total').textContent=t('page_total',{pages:n.format(lastPage.pages)});$('page-prev').disabled=listPage<=1;$('page-next').disabled=listPage>=lastPage.pages;}const count=[...drafts.keys()].filter(key=>JSON.parse(key)[0]===lastEntriesLanguage).length;$('draft-hint').textContent=count?t('draft_hint',{count:n.format(count)}):'';}
function renderEntries(){const active=document.activeElement,activeSource=active?.dataset?.source,selection=activeSource?[active.selectionStart,active.selectionEnd]:null,scrollTop=$('entries-scroll').scrollTop,rowLanguage=lastEntriesLanguage;$('entries').replaceChildren();for(const item of lastEntries){const tr=document.createElement('tr'),src=document.createElement('td'),dst=document.createElement('td'),action=document.createElement('td');src.textContent=item.source;const kind=document.createElement('div');kind.className='badge';kind.textContent=t('kind_'+item.kind);src.append(kind);const input=document.createElement('textarea'),draftKey=JSON.stringify([rowLanguage,item.source]);input.value=drafts.get(draftKey)??item.value;input.dataset.source=item.source;input.setAttribute('aria-label',t('translation_aria',{source:item.source}));const badge=document.createElement('div');function renderBadge(){const edited=drafts.has(draftKey);badge.className='badge '+(edited?'edited':item.state);badge.textContent=edited?t('draft_badge'):(!item.provider||item.provider==='original'?t('entry_'+item.state):providerLabel(item.provider)+' · '+t('entry_'+item.state));}renderBadge();input.oninput=()=>{if(input.value===item.value)drafts.delete(draftKey);else drafts.set(draftKey,input.value);renderBadge();renderListMeta();};dst.append(input,badge);const save=document.createElement('button');save.textContent=t('save');save.onclick=()=>run(async()=>{const value=input.value;await api('save',{source:item.source,value,language:rowLanguage});if(drafts.get(draftKey)===value)drafts.delete(draftKey);},'toast_saved');action.append(save);tr.append(src,dst,action);$('entries').append(tr);if(activeSource===item.source){input.focus({preventScroll:true});if(selection)input.setSelectionRange(...selection);}}if(!lastEntries.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=3;td.className='empty-row';td.textContent=t('list_empty');tr.append(td);$('entries').append(tr);}$('entries-scroll').scrollTop=scrollTop;renderListMeta();}
function renderLocale(){document.documentElement.lang=uiLocale;document.title=t('title');for(const e of document.querySelectorAll('[data-i18n]'))e.textContent=t(e.dataset.i18n);for(const e of document.querySelectorAll('[data-i18n-placeholder]'))e.placeholder=t(e.dataset.i18nPlaceholder);for(const e of document.querySelectorAll('[data-i18n-aria]'))e.setAttribute('aria-label',t(e.dataset.i18nAria));$('ui-language').value=uiLocale;$('guide').href='/docs/'+uiLocale+'.md';for(const option of $('language').options)option.textContent=gameLabel(option.value);renderStatus();renderEntries();if(currentToast)$('toast').textContent=t(currentToast.key,currentToast.params);}
async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'X-Session':session,'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok){const e=Error(j.error||'HTTP '+r.status);e.info=j.error_info;throw e;}return j;}
function toast(key,params={}){currentToast={key,params};$('toast').textContent=t(key,params);$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').style.display='none';currentToast=null;},4500);}
function showError(error){const info=error.info||{key:'error_generic',params:{detail:error.message}};toast(info.key,info.params);}
async function status(){try{const j=await api('status');lastStatus=j;if(!ready){for(const value of Object.keys(nativeNames))$('language').add(new Option(gameLabel(value),value));for(const key of ['language','game','provider','libre_url','daily_bytes'])$(key).value=j.config[key]??'';$('resume-provider').value=j.config.provider==='google'?'bing':j.config.provider==='bing'?'mymemory':'bing';for(const key of ['auto','online','offline_model','fallback'])$(key).checked=j.config[key];ready=true;}renderStatus();}catch(e){$('error').textContent=errorText(e.info,e.message);}}
async function entries(resetScroll=false){const ticket=++entriesRequest,params=new URLSearchParams({q:$('query').value,state:$('filter-state').value,provider:$('filter-provider').value,kind:$('filter-kind').value,order:$('filter-order').value,page:String(listPage),page_size:$('page-size').value});$('list-loading').textContent=t('list_loading');$('dictionary-table').setAttribute('aria-busy','true');try{const j=await api('entries?'+params);if(ticket!==entriesRequest)return;lastPage=j;listPage=j.page;lastEntries=j.entries;lastEntriesLanguage=j.language;if(resetScroll)$('entries-scroll').scrollTop=0;renderEntries();}finally{if(ticket===entriesRequest){$('list-loading').textContent='';$('dictionary-table').setAttribute('aria-busy','false');}}}
function applyFilters(){clearTimeout(searchTimer);listPage=1;entries(true).catch(showError);}
function changePage(page){clearTimeout(searchTimer);listPage=Math.max(1,Math.min(Math.trunc(Number(page))||1,lastPage?.pages||1));entries(true).catch(showError);}
async function poll(){if(polling||stopped)return;polling=true;try{await status();if(lastStatus){const p=lastStatus.progress,signature=JSON.stringify([lastStatus.config.language,lastStatus.cached,lastStatus.pending,p?.batch,p?.processed]);if(signature!==entriesSignature){await entries();entriesSignature=signature;}}}catch(e){showError(e);}finally{polling=false;}}
async function run(fn,key){try{await fn();toast(key);await status();await entries();}catch(e){showError(e);}}
for(const [value,label] of Object.entries(nativeNames))$('ui-language').add(new Option(label,value));
$('ui-language').onchange=()=>{uiLocale=normalizeLocale($('ui-language').value);try{localStorage.setItem('dressmaker-ui-language',uiLocale);}catch(e){}renderLocale();};
$('settings').onclick=()=>run(()=>api('settings',{language:$('language').value,game:$('game').value,provider:$('provider').value,libre_url:$('libre_url').value.trim(),daily_bytes:Number($('daily_bytes').value),auto:$('auto').checked,online:$('online').checked,offline_model:$('offline_model').checked,fallback:$('fallback').checked}),'toast_settings');
$('switch-provider').onclick=()=>run(async()=>{await api('switch-provider',{provider:$('resume-provider').value,...($('resume-provider').value==='libre'?{libre_url:$('libre_url').value.trim()}:{})});$('provider').value=$('resume-provider').value;$('online').checked=true;},'toast_switch_resume');
for(const id of ['scan','translate','install','uninstall'])$(id).onclick=()=>run(()=>api(id,{}),'toast_'+id);
$('manual').onclick=async()=>{const button=$('manual');button.disabled=true;try{const r=await fetch('/api/manual-package',{headers:{'X-Session':session}});if(!r.ok){const j=await r.json();const e=new Error(j.error);e.info=j.error_info;throw e;}const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=(r.headers.get('Content-Disposition')||'').match(/filename="([^"]+)"/)?.[1]||'Dressmaker-Languages-Manual.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('toast_manual');}catch(e){showError(e);}finally{button.disabled=false;}};
$('refresh').onclick=()=>run(()=>Promise.resolve(),'toast_refresh');$('search').onclick=applyFilters;$('query').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(applyFilters,300);};$('query').onkeydown=e=>{if(e.key==='Enter')applyFilters();};for(const id of ['filter-state','filter-provider','filter-kind','filter-order','page-size'])$(id).onchange=applyFilters;
$('reset-filters').onclick=()=>{$('query').value='';for(const id of ['filter-state','filter-provider','filter-kind'])$(id).value='all';$('filter-order').value='source';applyFilters();};$('page-prev').onclick=()=>changePage(listPage-1);$('page-next').onclick=()=>changePage(listPage+1);$('list-page').onchange=()=>changePage($('list-page').value);$('list-page').onkeydown=e=>{if(e.key==='Enter')changePage($('list-page').value);};
$('model').onclick=()=>run(()=>api('model',{language:$('language').value}),'toast_model');$('shutdown').onclick=async()=>{try{await api('shutdown',{});stopped=true;clearInterval(pollTimer);clearTimeout(searchTimer);renderStatus();}catch(e){showError(e);}};
history.replaceState(null,'','/');renderLocale();poll();pollTimer=setInterval(poll,1000);
</script></body></html>
